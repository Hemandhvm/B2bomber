<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2 Bomber🛫</title>
    <!-- Google Font for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* 1. Global Reset & Modern Dark Theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Sleek dark slate background */
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* 2. Page Header Accent */
        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
        }

        /* 3. High-Standard Card Container */
        figure.card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.25rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Subtle Hover Animation */
        figure.card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 30px -5px rgba(56, 189, 248, 0.15);
        }

        /* 4. Styled Image Wrapper */
        figure.card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            object-fit: cover;
        }

        /* 5. Sleek Caption Styling */
        figcaption {
            margin-top: 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: #94a3b8;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        figcaption::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #ef4444; /* Alert badge dot */
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <header>
        <h1>B2 Bomber 🛫</h1>
    </header>

    <!-- High-Standard Card Container -->
    <figure class="card">
        <img src="abijithvp2026-08-13 221340.png" alt="Abhijith VP chat">
        <img src="vpchat2026-08-14 at 1.31.50 PM.jpeg" alt="Abhijith VP chat">
        <figcaption>Abhijith VP leaked chat</figcaption>
    </figure>

    <div class="gallery-grid">
        

        <!-- Video Card -->
        <figure class="card">
            <video controls preload="metadata">
                <source src="project official video 2025-07-10 at 15.23.08_50ce0f04.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <figcaption>project official</figcaption>
        </figure>
    </div>

    <figure class="card">
        <img src="vpbike2026-08-14 at 11.52.31 AM.jpeg" alt="">
        <figcaption>Fiance</figcaption>
    </figure>

     <!-- Video Card -->
        <figure class="card">
            <video controls preload="metadata">
                <source src="vp 2026-08-14 at 11.53.10 AM.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <figcaption></figcaption>
        </figure>

        

</body>
</html>
